name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mirror Shark version
      description: Help > About
      placeholder: "1.8.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: "Pixel 7 Pro, Android 15"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: dropdown
    id: network
    attributes:
      label: How are the phone and PC connected?
      options:
        - Same Wi-Fi network
        - PC on the phone's hotspot
        - Other
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "End of `%LOCALAPPDATA%\\MirrorShark\\logs\\mirrorshark.log` (Help > Open log folder). Remove anything private."
      render: text
